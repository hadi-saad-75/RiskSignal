# RiskSignal neutral fintech theme. Detailed component styling is in src/risksignal/ui/theme.py.

[theme]
base = "light"
primaryColor = "#183153"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#172B45"
linkColor = "#2864A0"
linkUnderline = false
borderColor = "#DFE5EC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
buttonRadius = "small"
baseFontSize = 16
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
dataframeBorderColor = "#DFE5EC"
dataframeHeaderBackgroundColor = "#FFFFFF"
dataframeHeaderTextColor = "#475569"
chartCategoricalColors = ["#183153", "#2864A0", "#65758B", "#52647A", "#CBD5E1"]
redColor = "#B42318"
greenColor = "#067647"
yellowColor = "#A16207"
blueColor = "#2563EB"
orangeColor = "#C2410C"
violetColor = "#6D28D9"
grayColor = "#64748B"

[theme.sidebar]
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"
