# RiskSignal neutral fintech theme. Detailed component styling is in src/risksignal/ui/theme.py.

[theme]
base = "dark"
primaryColor = "#4C9AFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EDF7"
linkColor = "#7DB8FF"
linkUnderline = false
borderColor = "#23304A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
buttonRadius = "small"
baseFontSize = 16
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
dataframeborderColor = "#23304A"
dataframeHeaderBackgroundColor = "#111A2E"
dataframeHeaderTextColor = "#A8B6CB"
chartCategoricalColors = ["#4C9AFF", "#7DB8FF", "#8393AB", "#A8B6CB", "#34456A"]
redColor = "#F97066"
greenColor = "#32D583"
yellowColor = "#FDB022"
blueColor = "#4C9AFF"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
grayColor = "#8393AB"

[theme.sidebar]
backgroundColor = "#0E1729"
secondaryBackgroundColor = "#0B1220"

[client]
toolbarMode = "minimal"
